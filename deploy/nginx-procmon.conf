# /etc/nginx/conf.d/procmon.conf on the EC2 machine. Passes the monitor's hostname to procmon on 127.0.0.1:8081.
# Replace the server_name with your own hostname and point its DNS A record at the instance first.
# TLS: run  sudo certbot --nginx -d monitor.projects-rkm.in  once; certbot adds the 443 block and the redirect.
# Apply:  sudo nginx -t && sudo systemctl reload nginx
#
# procmon asks for a username and password itself (see /etc/procmon.env), so do not skip TLS:
# basic auth over plain HTTP sends the password in clear text.

server {
    listen 80;
    server_name monitor.projects-rkm.in;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
